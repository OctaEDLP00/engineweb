<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      href="data:,"
    />
    <title>EngineWeb Arena — game example</title>
    <link
      rel="stylesheet"
      href="/src/style.css"
    />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>EngineWeb Arena</h1>
        <div id="hud">
          <span>Score <strong id="score">0</strong></span>
          <span>Lives <strong id="lives">3</strong></span>
          <span>FPS <strong id="fps">—</strong></span>
          <button
            id="settings-button"
            type="button"
            title="Settings"
          >
            ⚙
          </button>
        </div>
      </header>
      <div id="stage">
        <canvas
          id="game"
          width="640"
          height="480"
        ></canvas>
        <div id="overlay">
          <h2>EngineWeb Arena</h2>
          <p id="overlay-text">Collect every orb. Dodge the chasers.</p>
          <button
            id="overlay-button"
            type="button"
          >
            Enable sound &amp; play
          </button>
        </div>
        <div
          id="settings"
          hidden
        >
          <h2>Settings</h2>
          <label>
            Volume <span id="volume-value">80</span>
            <input
              id="volume"
              type="range"
              min="0"
              max="100"
              step="1"
              value="80"
            />
          </label>
          <label class="row">
            <input
              id="mute"
              type="checkbox"
            />
            Mute
          </label>
          <label>
            Difficulty
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option
                value="normal"
                selected
              >
                Normal
              </option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <label class="row">
            <input
              id="ghost"
              type="checkbox"
              checked
            />
            Player ghost trail
          </label>
          <label class="row">
            <input
              id="meteors"
              type="checkbox"
              checked
            />
            Meteors
          </label>
          <label>
            Terrain seed
            <span class="seed-row">
              <input
                id="seed"
                type="number"
                min="0"
                max="9999"
                step="1"
                value="7"
              />
              <button
                id="seed-apply"
                type="button"
              >
                Apply
              </button>
            </span>
          </label>
          <button
            id="settings-close"
            type="button"
          >
            Close
          </button>
        </div>
      </div>
      <footer>
        Move with <kbd>WASD</kbd> or <kbd>arrows</kbd> — every system below runs on an
        <code>@engineweb/*</code> package.
      </footer>
    </div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
